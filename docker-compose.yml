x-laravel-environment: &laravel-environment
  APP_URL: http://localhost:${DOCKER_APP_PORT:-8080}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DOCKER_DB_DATABASE:-campaign_app}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-campaign_app}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
  QUEUE_CONNECTION: redis
  COMMUNICATION_QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app-volumes: &app-volumes
  - ./:/var/www
  - composer_vendor:/var/www/vendor

services:
  app:
    image: campaign-app-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    command: >-
      sh -c "composer install --no-interaction --prefer-dist &&
      php artisan config:clear && php-fpm"
    environment: *laravel-environment
    volumes: *app-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: campaign-app-php
    pull_policy: never
    working_dir: /var/www
    command: >-
      sh -c "until [ -f vendor/autoload.php ]; do sleep 1; done;
      npm ci --no-audit --no-fund && npm run dev"
    environment:
      <<: *laravel-environment
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_PORT: 5173
      VITE_DEV_SERVER_URL: http://127.0.0.1:${DOCKER_VITE_PORT:-5174}
      VITE_CORS_ORIGIN: http://localhost:${DOCKER_APP_PORT:-8080}
      VITE_HMR_HOST: 127.0.0.1
      VITE_HMR_PORT: 5173
      VITE_HMR_CLIENT_PORT: ${DOCKER_VITE_PORT:-5174}
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5174}:5173"
    volumes:
      - ./:/var/www
      - composer_vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: campaign-app-php
    pull_policy: never
    working_dir: /var/www
    command: php artisan queue:work --tries=1
    environment: *laravel-environment
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-campaign_app}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-campaign_app}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${DOCKER_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "127.0.0.1:${DOCKER_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  composer_vendor:
  mysql_data:
  node_modules:
