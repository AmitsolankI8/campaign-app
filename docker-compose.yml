version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

    networks:
      - laravel

  nginx:
    image: nginx:latest

    container_name: laravel_nginx

    ports:
      - "80:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8.0

    container_name: laravel_mysql

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  redis:
    image: redis:alpine

    container_name: laravel_redis

    ports:
      - "6379:6379"

    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel: